name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FYNE_TOOLS: fyne.io/tools/cmd/fyne@v1.7.2
  # Oldest macOS the app runs on (also read by clang for the cgo parts).
  # It must match the Go toolchain in go.mod:
  # Go 1.25 → 12.0 (Monterey), Go 1.26/1.27 → 13.0 (Ventura).
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System libraries (OpenGL, X11, ALSA)
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libasound2-dev
      - run: go vet ./...
      - run: go test -race ./...

  macos:
    needs: test
    runs-on: macos-latest # Apple Silicon; the Intel half is cross-compiled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install "$FYNE_TOOLS"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_FLAG=--app-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Universal binaries (arm64 + x86_64)
        run: |
          mkdir -p build
          for cmd in sp404gui sp404; do
            CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -o "build/$cmd-arm64" "./cmd/$cmd"
            CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -o "build/$cmd-amd64" "./cmd/$cmd"
            lipo -create -output "build/$cmd" "build/$cmd-arm64" "build/$cmd-amd64"
            lipo -info "build/$cmd"
          done
      - name: Package wav404.app
        working-directory: cmd/sp404gui
        run: |
          fyne package --os darwin --exe ../../build/sp404gui --app-build "$GITHUB_RUN_NUMBER" $VERSION_FLAG
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion $MACOSX_DEPLOYMENT_TARGET" wav404.app/Contents/Info.plist
          codesign --force --deep --sign - wav404.app
          codesign --verify --deep --strict wav404.app
          mkdir -p ../../dist
          ditto -c -k --keepParent wav404.app ../../dist/wav404-macos-universal.zip
          cd ../../build && zip ../dist/sp404-cli-macos-universal.zip sp404
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: C compiler (cgo)
        run: |
          if ! command -v gcc >/dev/null; then
            choco install -y mingw
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi
      - run: gcc --version
      - run: go install "$FYNE_TOOLS"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_FLAG=--app-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Package wav404.exe
        working-directory: cmd/sp404gui
        run: fyne package --os windows --app-build "$GITHUB_RUN_NUMBER" $VERSION_FLAG
      - name: Zip
        run: |
          mkdir -p dist
          go build -trimpath -o dist/sp404.exe ./cmd/sp404
          cp cmd/sp404gui/wav404.exe dist/
          cd dist
          7z a wav404-windows-amd64.zip wav404.exe
          7z a sp404-cli-windows-amd64.zip sp404.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
