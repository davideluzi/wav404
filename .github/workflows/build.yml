name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FYNE_TOOLS: fyne.io/tools/cmd/fyne@v1.7.2
  # Oldest macOS the app runs on (also read by clang for the cgo parts).
  # It must match the Go toolchain in go.mod:
  # Go 1.25 → 12.0 (Monterey), Go 1.26/1.27 → 13.0 (Ventura).
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: System libraries (OpenGL, X11, Wayland, ALSA)
        run: >-
          sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
          libwayland-dev libxkbcommon-dev libasound2-dev
      - run: go vet ./...
      - run: go test -race ./...

  macos:
    needs: test
    runs-on: macos-latest # Apple Silicon; the Intel half is cross-compiled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install "$FYNE_TOOLS"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_FLAG=--app-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Universal binaries (arm64 + x86_64)
        run: |
          mkdir -p build
          for cmd in wav404 sp404; do
            CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -o "build/$cmd-arm64" "./cmd/$cmd"
            CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -o "build/$cmd-amd64" "./cmd/$cmd"
            lipo -create -output "build/$cmd" "build/$cmd-arm64" "build/$cmd-amd64"
            lipo -info "build/$cmd"
          done
      - name: Package wav404.app and wav404.dmg
        working-directory: cmd/wav404
        run: |
          fyne package --os darwin --exe ../../build/wav404 --app-build "$GITHUB_RUN_NUMBER" $VERSION_FLAG
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion $MACOSX_DEPLOYMENT_TARGET" wav404.app/Contents/Info.plist
          codesign --force --deep --sign - wav404.app
          codesign --verify --deep --strict wav404.app
          mkdir -p ../../dist
          # Disk image with the app and a link to /Applications to drag it onto.
          staging=$(mktemp -d)
          ditto wav404.app "$staging/wav404.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname wav404 -srcfolder "$staging" -fs HFS+ -format UDZO -ov \
            ../../dist/wav404-macos-universal.dmg
          hdiutil verify ../../dist/wav404-macos-universal.dmg
          mnt=$(hdiutil attach -nobrowse -readonly ../../dist/wav404-macos-universal.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          codesign --verify --deep --strict "$mnt/wav404.app"
          hdiutil detach "$mnt"
          cd ../../build && zip ../dist/sp404-cli-macos-universal.zip sp404
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: C compiler (cgo)
        run: |
          if ! command -v gcc >/dev/null; then
            choco install -y mingw
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi
      - run: gcc --version
      - run: go install "$FYNE_TOOLS"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_FLAG=--app-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Package wav404.exe
        working-directory: cmd/wav404
        run: fyne package --os windows --app-build "$GITHUB_RUN_NUMBER" $VERSION_FLAG
      - name: Zip
        run: |
          mkdir -p dist
          go build -trimpath -o dist/sp404.exe ./cmd/sp404
          cp cmd/wav404/wav404.exe dist/
          cd dist
          7z a wav404-windows-amd64.zip wav404.exe
          7z a sp404-cli-windows-amd64.zip sp404.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
